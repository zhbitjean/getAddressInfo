<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="批量查询纽约市物业资料并下载 Excel、I-Card 和 CO 文件。">
<title>NYC Property Batch Lookup</title><link rel="stylesheet" href="/static/style.css">
</head><body><main class="shell">
<header><div class="eyebrow">NYC PROPERTY RESEARCH</div><h1>批量查询地址</h1>
<p class="lead">上传 Excel，服务器完成查询后直接返回物业结果、I‑Card 和可取得的 CO 文件。</p></header>
<section class="workspace"><form id="lookup-form">
<label><span>Excel 文件</span><input name="workbook" type="file" accept=".xlsx,.xlsm" required><small>支持 .xlsx / .xlsm，最大 20 MB</small></label>
<label><span>地址列名</span><input name="column" type="text" value="Jobsite" required><small>程序会在前 50 行寻找这个标题</small></label>
<button id="submit" type="submit">开始查询</button></form>
<div id="message" class="message" hidden role="alert"></div>
<section id="progress" class="progress-panel" hidden aria-live="polite">
<div class="progress-heading"><div><span class="status-label">查询状态</span><strong id="progress-text">查询进行中…</strong></div><span>Cloud Run</span></div>
<div class="track"><div id="bar" class="indeterminate"></div></div>
<p id="note">请保持此页面开启。完成后浏览器会自动下载 ZIP。</p>
<a id="download" class="download" hidden>再次下载结果 ZIP</a>
</section></section>
<aside><h2>输入格式</h2><p>工作簿需要有一列标题为 <code>Jobsite</code>，每行填写一个纽约市地址。错误会写进结果文件，不会中断整批查询。</p></aside>
</main><script>
const form=document.querySelector('#lookup-form'),button=document.querySelector('#submit'),message=document.querySelector('#message'),panel=document.querySelector('#progress'),text=document.querySelector('#progress-text'),note=document.querySelector('#note'),download=document.querySelector('#download');
function fail(value){message.textContent=value;message.hidden=false;button.disabled=false;button.textContent='重新尝试';text.textContent='查询未完成';note.textContent='请根据错误提示修改输入后重试。'}
form.addEventListener('submit',async event=>{
 event.preventDefault();message.hidden=true;download.hidden=true;panel.hidden=false;button.disabled=true;button.textContent='查询进行中…';text.textContent='服务器正在查询 NYC 数据…';note.textContent='请保持此页面开启。完成后浏览器会自动下载 ZIP。';
 try{
  const response=await fetch('/api/process',{method:'POST',body:new FormData(form)});
  if(!response.ok){let detail='查询失败';try{detail=(await response.json()).detail||detail}catch{}throw Error(detail)}
  const blob=await response.blob(),disposition=response.headers.get('content-disposition')||'',match=disposition.match(/filename=\"?([^\";]+)\"?/i),filename=match?match[1]:'property_results.zip',url=URL.createObjectURL(blob);
  download.href=url;download.download=filename;download.hidden=false;download.click();
  text.textContent='查询完成';note.textContent='ZIP 已生成。如果没有自动下载，请点击按钮。';button.disabled=false;button.textContent='开始新查询';
 }catch(error){fail(error.message||'发生未知错误')}
});
</script></body></html>
